[package]
name = "personal-dashboard"
version = "0.1.0"
edition = "2021"
description = "Kişisel dashboard: habit tracker ve daily routine takibi"

[dependencies]
gpui-kit = "0.8.1"
gpui-kit-assets = "0.8.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sysinfo = "0.39.6"
nvml-wrapper = "0.13.0"
windows = { version = "0.62.2", features = ["Media", "Media_Control", "Storage_Streams", "Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
windows-future = "0.3.2"
rustfft = "6"
yt-dlp = "2.9.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

# yt-dlp modeli TikTok/özgür çıkarıcıların döndürmediği alanları zorunlu
# bekliyor (missing field `age_limit`); kaynakta esnetilmiş yamalı kopya:
[patch.crates-io]
yt-dlp = { path = "patches/yt-dlp" }

[profile.release]
lto = "thin"
