[package]
name = "personal-dashboard"
version = "0.1.0"
edition = "2021"
description = "Kişisel dashboard: habit tracker ve daily routine takibi"

[dependencies]
gpui-kit = "0.8.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sysinfo = "0.39.6"
nvml-wrapper = "0.13.0"
windows = { version = "0.62.2", features = ["Media", "Media_Control", "Storage_Streams", "Foundation", "Win32_Media_Audio", "Win32_System_Com"] }
windows-future = "0.3.2"
rustfft = "6"

[profile.release]
lto = "thin"
